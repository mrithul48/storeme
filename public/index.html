<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LaunchCommerce Admin</title>
  <style>
    :root {
      --bg: #070B24;
      --card: #101A3D;
      --border: #202D55;
      --primary: #4169E1;
      --primary-hover: #3458C7;
      --text: #F5F7FF;
      --text-muted: #A5B2D1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: var(--primary);
      color: white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 20px;
      box-shadow: 0 6px 18px rgba(65, 105, 225, 0.35);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(65, 105, 225, 0.3);
    }
    .btn:active {
      transform: scale(0.98);
      background-color: var(--primary-hover);
    }
    .brand-sub {
      margin-top: 24px;
      font-size: 11px;
      color: #7181A8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">L</div>
    <h1>LaunchCommerce Admin</h1>
    <p>Connecting to your merchant dashboard... If you are offline, please check your network connection and retry.</p>
    <button class="btn" onclick="retryConnection()">Retry Connection</button>
  </div>
  <div class="brand-sub">Secure Merchant Admin</div>

  <script>
    function retryConnection() {
      const btn = document.querySelector('.btn');
      btn.innerText = 'Connecting...';
      btn.disabled = true;
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    }

    // Auto-retry when network is detected back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
